<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tampa Bay Industrial Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<style>
  :root{
    --bay:#16232E; --bay-2:#1F3240; --line:#2E4556;
    --text:#EEF2F0; --muted:#9DB0B8; --sodium:#F2B33D; --gulf:#5FC4B8;
    --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bay);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45}
  button{font:inherit;color:inherit}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--sodium);outline-offset:2px}

  /* HOME */
  #home{position:fixed;inset:0}
  #map{position:absolute;inset:0;background:#0d1a22}
  .pp{width:20px;height:27px;cursor:pointer;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));transform-origin:50% 100%;transition:transform .12s}
  .pp:hover{transform:scale(1.2)}
  .pp svg{display:block}
  .leaflet-tooltip.tip{background:var(--bay);color:var(--text);border:1px solid var(--line);border-radius:8px;font-family:var(--font);font-size:13px;padding:8px 10px;box-shadow:none}
  .leaflet-tooltip.tip::before{display:none}
  .tip b{display:block;font-size:14px}
  .tip span{color:var(--muted)}
  .leaflet-control-attribution{font-size:10.5px}

  /* PAGES */
  .page{display:none;min-height:100%;padding:0 0 60px}
  .top{position:sticky;top:0;z-index:5;background:var(--bay);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .back{border:1px solid var(--line);background:var(--bay-2);border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none}
  .crumb{color:var(--muted);font-size:13.5px}
  .wrap{max-width:1100px;margin:0 auto;padding:28px}
  .hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
  .photo{aspect-ratio:16/10;border-radius:12px;border:1px dashed var(--line);background:var(--bay-2);display:grid;place-items:center;color:var(--muted);font-size:14px;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover}
  h2{margin:0;font-size:40px;font-weight:800;font-stretch:78%;line-height:1.02}
  .addr{color:var(--muted);margin:8px 0 22px}
  .facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin:0}
  .facts div{padding:12px 0;border-bottom:1px solid var(--line)}
  .facts div:nth-child(odd){padding-right:14px}
  .facts dt{color:var(--muted);font-size:12.5px}
  .facts dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
  h3{font-size:20px;font-weight:700;font-stretch:85%;margin:44px 0 12px;display:flex;align-items:baseline;gap:10px}
  h3 small{color:var(--muted);font-weight:400;font-size:14px}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
  th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:12.5px;background:var(--bay-2);white-space:nowrap}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  tfoot td{background:var(--bay-2);font-weight:700;border-bottom:0;border-top:1px solid var(--line)}
  .sub{color:var(--muted);font-size:12.5px;display:block}
  .soon{color:var(--sodium);font-weight:600}
  .est{font-style:italic;color:var(--muted)}
  .est.soon{color:var(--sodium)}
  .muted{color:var(--muted)}
  .tlink{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  .tlink:hover{text-decoration-color:var(--sodium)}
  .foot{color:var(--muted);font-size:13px;margin-top:10px}

  /* prospects */
  .pros{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{background:var(--bay-2);border:1px solid var(--line);border-left:3px solid var(--sodium);border-radius:10px;padding:14px 16px;text-align:left;cursor:pointer;width:100%}
  .card:hover{border-color:var(--sodium)}
  .card b{display:block;font-size:15.5px;margin-bottom:2px}
  .card .meta{color:var(--muted);font-size:12.5px}
  .card p{margin:8px 0 0;font-size:13px;color:var(--text);opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);font-size:14px}

  /* tenant page */
  .tfacts{grid-template-columns:repeat(4,1fr)}
  .note-src{background:var(--bay-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:26px}
  .note-src span{color:var(--muted);font-size:12.5px;display:block;margin-bottom:4px}
  .toggle{display:inline-flex;align-items:center;gap:10px;margin-top:22px;border:1px solid var(--line);background:var(--bay-2);border-radius:999px;padding:8px 16px 8px 10px;cursor:pointer}
  .toggle i{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
  .toggle i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--text);transition:transform .15s}
  .toggle[aria-pressed="true"] i{background:var(--sodium)}
  .toggle[aria-pressed="true"] i::after{transform:translateX(14px);background:var(--bay)}
  .research{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .research .full{grid-column:1/-1}
  .field label{display:block;font-weight:700;font-stretch:85%;font-size:17px;margin-bottom:6px}
  .field label small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px;font-stretch:100%}
  textarea{width:100%;min-height:170px;resize:vertical;background:var(--bay-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:14px;line-height:1.5}
  textarea::placeholder{color:var(--muted)}
  textarea:focus{outline:none;border-color:var(--sodium)}
  .saved{color:var(--muted);font-size:12.5px;min-height:18px;margin-top:8px}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
  .tools button,.tools label{border:1px solid var(--line);background:var(--bay-2);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13.5px}
  .tools p{flex-basis:100%;margin:4px 0 0;color:var(--muted);font-size:12.5px}

  @media (max-width:760px){
    .leaflet-control-zoom{display:none}
    .hero,.research{grid-template-columns:1fr}
    .tfacts{grid-template-columns:1fr 1fr}
    h2{font-size:30px}
    .wrap{padding:18px}
    .top{padding:12px 18px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const dash="—";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n==null?dash:Number(n).toLocaleString("en-US");
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
};

function dText(d){
  if(!d) return null;
  if(d.text && d.y==null) return d.text;
  if(d.text) return d.text;
  return d.prec==="y" ? String(d.y) : `${MON[d.m-1]} ${d.y}`;
}
function monthsUntil(d){const n=new Date();return (d.y-n.getFullYear())*12+((d.m||1)-1-n.getMonth())}
/* expiration: actual, or move-in + 5 yrs marked (estimate) */
function expInfo(t){
  if(t.exp && t.exp.y!=null) return {d:t.exp,txt:dText(t.exp),est:false};
  if(t.exp && t.exp.text) return {d:null,txt:t.exp.text,est:false};
  if(t.placeholder) return {d:null,txt:null,est:false};
  if(t.moveIn && t.moveIn.y!=null){
    /* 5-year term from move-in; if that's already passed, assume renewals in 5-year terms */
    const d={y:t.moveIn.y+5,m:t.moveIn.m,prec:t.moveIn.prec};
    while(monthsUntil(d)<0) d.y+=5;
    return {d,txt:dText(d)+" (estimate)",est:true};
  }
  return {d:null,txt:null,est:false};
}
function sfText(t){return t.sf==null?dash:(t.sfApprox||"")+fmt(t.sf)}

/* flatten tenants with building refs */
PROPERTIES.forEach(p=>{
  p.tenants=[];
  p.buildings.forEach((b,bi)=>b.tenants.forEach(t=>{
    t.building=b.name; t.bi=bi; t.key=p.id+":"+slug(t.name)+":"+bi;
    t.idx=p.tenants.length; p.tenants.push(t);
  }));
  p.address=(p.buildings[0].address||"")+", "+p.city;
});

function isProspect(t){
  const v=store.get("prospect:"+t.key);
  return v==null ? !!t.prospect : v==="1";
}

/* ---------- PROPERTY PAGE ---------- */
function summary(p){
  const B=p.buildings;
  const rsf=B.reduce((a,b)=>a+(b.rsf||0),0);
  const occB=B.filter(b=>b.rsf&&b.occupancy!=null);
  const occRsf=occB.reduce((a,b)=>a+b.rsf,0);
  const occ=occRsf?occB.reduce((a,b)=>a+b.rsf*b.occupancy/100,0)/occRsf*100:null;
  const yrs=B.flatMap(b=>(b.built||"").match(/\d{4}/g)||[]).map(Number);
  const built=yrs.length?(Math.min(...yrs)===Math.max(...yrs)?String(yrs[0]):`${Math.min(...yrs)}–${Math.max(...yrs)}`):null;
  const owners=[...new Set(B.map(b=>b.owner).filter(Boolean))];
  const cls=[...new Set(B.map(b=>b.cls).filter(Boolean))].sort();
  return {rsf,occ,built,owners,cls,occSF:occB.reduce((a,b)=>a+b.rsf*b.occupancy/100,0)};
}
const pct=v=>v==null?dash:(Math.round(v*10)/10)+"%";

function renderProperty(p){
  const s=summary(p);
  const bRows=p.buildings.map(b=>`<tr>
    <td>${esc(b.name||dash)}${b.name!==b.address&&b.address?`<span class="sub">${esc(b.address)}</span>`:""}</td>
    <td>${esc(b.owner||dash)}</td><td>${b.cls?"Class "+esc(b.cls):dash}</td><td>${esc(b.built||dash)}</td>
    <td class="num">${fmt(b.rsf)}</td><td class="num">${pct(b.occupancy)}</td></tr>`).join("");
  const multi=p.buildings.length>1;
  const bFoot=`<tfoot><tr><td colspan="4">Total${multi?` · ${p.buildings.length} buildings`:""}</td>
    <td class="num">${fmt(s.rsf)}</td><td class="num">${pct(s.occ)}</td></tr></tfoot>`;

  const pros=p.tenants.filter(t=>!t.placeholder&&isProspect(t));
  const prosHTML=pros.length?`<div class="pros">${pros.map(t=>{const e=expInfo(t);return `
    <button class="card" data-t="${t.idx}"><b>${esc(t.name)}</b>
    <span class="meta">${esc(t.building||"")} · ${sfText(t)} SF${e.txt?` · Exp. ${esc(e.txt)}`:""}</span>
    ${t.note?`<p>${esc(t.note)}</p>`:""}</button>`}).join("")}</div>`
    :`<div class="empty">No active prospects in this park yet. Open a tenant and switch on “Active prospect” to add them here.</div>`;

  const ten=p.tenants.slice().sort((a,b)=>{
    const ea=expInfo(a).d, eb=expInfo(b).d;
    const ka=ea?ea.y*12+ea.m:1e9, kb=eb?eb.y*12+eb.m:1e9; return ka-kb;});
  const tRows=ten.map(t=>{
    const e=expInfo(t), m=e.d?monthsUntil(e.d):null, soon=m!=null&&m>=0&&m<=24;
    const name=t.placeholder?`<span class="muted">${esc(t.name)}</span>`:`<button class="tlink" data-t="${t.idx}">${esc(t.name)}</button>`;
    return `<tr><td>${name}</td><td>${esc(t.building||dash)}<span class="sub">${esc(t.address||"")}</span></td>
      <td class="num">${sfText(t)}</td><td class="num">${esc(dText(t.moveIn)||dash)}</td>
      <td class="num ${soon?"soon":""} ${e.est?"est":""}">${esc(e.txt||dash)}</td></tr>`}).join("");

  $("prop").innerHTML=`
  <div class="top"><a class="back" href="#">Back to map</a><span class="crumb">${esc(p.market)}</span></div>
  <div class="wrap">
    <div class="hero">
      <div class="photo">${p.photo?`<img src="${esc(p.photo)}" alt="${esc(p.name)}">`:"Building photo"}</div>
      <div>
        <h2>${esc(p.name)}</h2>
        <p class="addr">${esc(p.address)}</p>
        <dl class="facts">
          <div><dt>Property type</dt><dd>Industrial${s.cls.length?", Class "+s.cls.join(" / "):""}</dd></div>
          <div><dt>Rentable SF</dt><dd>${fmt(s.rsf||null)}</dd></div>
          <div><dt>Owner</dt><dd>${esc(s.owners.join(", ")||dash)}</dd></div>
          <div><dt>Occupancy</dt><dd>${pct(s.occ)}</dd></div>
          <div><dt>Year built</dt><dd>${esc(s.built||dash)}</dd></div>
          <div><dt>Buildings</dt><dd>${p.buildings.length}</dd></div>
        </dl>
      </div>
    </div>

    <h3>Buildings<small>${p.buildings.length}</small></h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Building</th><th>Owner</th><th>Class</th><th>Built</th><th class="num">RSF</th><th class="num">Occupancy</th></tr></thead>
      <tbody>${bRows}</tbody>${bFoot}
    </table></div>
    <p class="foot">Total occupancy is weighted by each building's RSF.</p>

    <h3>Active Prospects<small>${pros.length||""}</small></h3>
    ${prosHTML}

    <h3>Tenants<small>${p.tenants.length}</small></h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Tenant</th><th>Building</th><th class="num">SF</th><th class="num">Lease move-in</th><th class="num">Lease expiration</th></tr></thead>
      <tbody>${tRows||`<tr><td colspan="5" class="muted">Tenant list to be added.</td></tr>`}</tbody>
    </table></div>
    <p class="foot">Expirations within 24 months are highlighted. Where no expiration was provided, it’s estimated from move-in using 5-year terms (rolled forward if the first term has already ended).</p>
  </div>`;
  $("prop").querySelectorAll("[data-t]").forEach(el=>el.onclick=()=>{location.hash=`#/property/${p.id}/tenant/${el.dataset.t}`});
}

/* ---------- TENANT PAGE ---------- */
const FIELDS=[["contact","Contact Research","Decision makers, titles, phone, email, LinkedIn…"],
              ["company","Company Research","HQ, locations, industry, growth, ownership, tenant rep…"],
              ["notes","Our Notes","Meetings, calls, next steps…"]];
function renderTenant(p,t){
  const e=expInfo(t), m=e.d?monthsUntil(e.d):null, soon=m!=null&&m>=0&&m<=24;
  const pressed=isProspect(t);
  $("ten").innerHTML=`
  <div class="top"><a class="back" href="#/property/${p.id}">Back to ${esc(p.name)}</a><span class="crumb">${esc(p.market)} · ${esc(p.name)}</span></div>
  <div class="wrap">
    <h2>${esc(t.name)}</h2>
    <p class="addr">${esc(t.building||"")}${t.address?" · "+esc(t.address):""}</p>
    <dl class="facts tfacts">
      <div><dt>Square feet</dt><dd>${sfText(t)}</dd></div>
      <div><dt>Lease move-in</dt><dd>${esc(dText(t.moveIn)||dash)}</dd></div>
      <div><dt>Lease expiration</dt><dd class="${soon?"soon":""} ${e.est?"est":""}">${esc(e.txt||dash)}</dd></div>
      <div><dt>Park</dt><dd>${esc(p.name)}</dd></div>
    </dl>
    <button class="toggle" id="pt" aria-pressed="${pressed}"><i></i>Active prospect</button>
    ${t.note?`<div class="note-src"><span>Note from stack plan</span>${esc(t.note)}</div>`:""}
    <h3>Research</h3>
    <div class="research">
      ${FIELDS.map(([k,l,ph],i)=>`<div class="field ${i===2?"full":""}">
        <label for="f-${k}">${l}<small>saves automatically</small></label>
        <textarea id="f-${k}" data-k="${k}" placeholder="${ph}">${esc(store.get(`note:${t.key}:${k}`)||"")}</textarea></div>`).join("")}
    </div>
    <div class="saved" id="saved"></div>
    <div class="tools">
      <button id="exp">Export all notes</button>
      <label>Import notes<input type="file" id="imp" accept=".json" hidden></label>
      <p>Notes are saved in this browser only. Export them to back up, move to another computer, or send to be added into the site permanently.</p>
    </div>
  </div>`;
  $("pt").onclick=ev=>{const v=ev.currentTarget.getAttribute("aria-pressed")!=="true";
    ev.currentTarget.setAttribute("aria-pressed",v);store.set("prospect:"+t.key,v?"1":"0")};
  let timer;
  $("ten").querySelectorAll("textarea").forEach(ta=>ta.oninput=()=>{
    clearTimeout(timer);timer=setTimeout(()=>{
      const ok=store.set(`note:${t.key}:${ta.dataset.k}`,ta.value);
      $("saved").textContent=ok?"Saved "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"Couldn't save in this browser. Use Export to keep a copy.";
    },400)});
  $("exp").onclick=exportNotes; $("imp").onchange=importNotes;
}
function exportNotes(){
  const data={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^(note|prospect):/.test(k))data[k]=localStorage.getItem(k)}}catch(e){}
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));
  a.download="tenant-notes-"+new Date().toISOString().slice(0,10)+".json";a.click();
}
function importNotes(ev){
  const f=ev.target.files[0]; if(!f) return;
  f.text().then(txt=>{const d=JSON.parse(txt);Object.entries(d).forEach(([k,v])=>store.set(k,v));route();
    $("saved")&&($("saved").textContent="Notes imported.")}).catch(()=>alert("That file couldn't be read."));
}

/* ---------- ROUTER ---------- */
function route(){
  const m=location.hash.match(/^#\/property\/([^/]+)(?:\/tenant\/(\d+))?$/);
  const p=m&&PROPERTIES.find(x=>x.id===m[1]);
  const t=p&&m[2]!=null?p.tenants[+m[2]]:null;
  $("home").style.display=p?"none":"block";
  $("prop").style.display=p&&!t?"block":"none";
  $("ten").style.display=t?"block":"none";
  if(t) renderTenant(p,t); else if(p) renderProperty(p); else map.invalidateSize();
  if(p) window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
