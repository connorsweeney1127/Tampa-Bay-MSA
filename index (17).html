<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>East Tampa Portfolio Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<style>
  :root{
    --bay:#16232E; --bay-2:#1F3240; --line:#2E4556;
    --text:#EEF2F0; --muted:#9DB0B8; --sodium:#F2B33D; --gulf:#5FC4B8;
    --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bay);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--sodium);outline-offset:2px}

  /* HOME: full-page satellite map */
  #home{position:fixed;inset:0}
  #map{position:absolute;inset:0;background:#0d1a22}

  /* pinpoint marker */
  .pp{width:30px;height:40px;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));transform-origin:50% 100%;transition:transform .12s}
  .pp:hover{transform:scale(1.15)}
  .pp svg{display:block}
  .leaflet-tooltip.tip{
    background:var(--bay);color:var(--text);border:1px solid var(--line);border-radius:8px;
    font-family:var(--font);font-size:13px;padding:8px 10px;box-shadow:none;
  }
  .leaflet-tooltip.tip::before{display:none}
  .tip b{display:block;font-size:14px}
  .tip span{color:var(--muted)}
  .leaflet-control-attribution{font-size:10.5px}

  /* PROPERTY PAGE */
  #prop{display:none;min-height:100%;padding:0 0 60px}
  .prop-top{
    position:sticky;top:0;z-index:5;background:var(--bay);border-bottom:1px solid var(--line);
    padding:14px 28px;display:flex;align-items:center;gap:16px;
  }
  .back{border:1px solid var(--line);background:var(--bay-2);border-radius:8px;padding:8px 14px;cursor:pointer}
  .wrap{max-width:1100px;margin:0 auto;padding:28px}
  .prop-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
  .photo{
    aspect-ratio:16/10;border-radius:12px;border:1px dashed var(--line);background:var(--bay-2);
    display:grid;place-items:center;color:var(--muted);font-size:14px;overflow:hidden;
  }
  .photo img{width:100%;height:100%;object-fit:cover}
  .prop-hero h2{margin:0;font-size:40px;font-weight:800;font-stretch:78%;line-height:1.02}
  .addr{color:var(--muted);margin:8px 0 22px}
  .facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin:0}
  .facts div{padding:12px 0;border-bottom:1px solid var(--line)}
  .facts dt{color:var(--muted);font-size:12.5px}
  .facts dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
  h3{font-size:20px;font-weight:700;font-stretch:85%;margin:44px 0 12px}
  h3 small{color:var(--muted);font-weight:400;font-size:14px;margin-left:8px}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
  th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:12.5px;background:var(--bay-2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.empty{color:var(--muted)}
  tr:last-child td{border-bottom:0}
  .soon{color:var(--sodium);font-weight:600}

  @media (max-width:760px){
    .leaflet-control-zoom{display:none}
    .prop-hero{grid-template-columns:1fr}
    .prop-hero h2{font-size:30px}
    .wrap{padding:18px}
    .prop-top{padding:12px 18px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="home"><div id="map" aria-label="Satellite map of the Tampa Bay MSA"></div></section>

<section id="prop">
  <div class="prop-top">
    <button class="back" onclick="location.hash=''">Back to map</button>
  </div>
  <div class="wrap" id="propBody"></div>
</section>

        "name": "Metlock Roofing",
        "suite": null,
        "sf": null,
        "exp": null
      }
    ]
  }
];

/* Tampa Bay MSA (Hillsborough, Pinellas, Pasco, Hernando) */
const MSA_BOUNDS = L.latLngBounds([27.56,-82.92],[28.70,-82.05]);

const map = L.map("map",{minZoom:9,maxZoom:19,maxBounds:MSA_BOUNDS.pad(0.6),maxBoundsViscosity:0.8});
map.zoomControl.setPosition("topright");
map.fitBounds(MSA_BOUNDS);

const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/";
L.tileLayer(ESRI+"World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,
  attribution:"Imagery &copy; Esri, Maxar, Earthstar Geographics"}).addTo(map);
L.tileLayer(ESRI+"Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,opacity:.7}).addTo(map);
L.tileLayer(ESRI+"Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:19}).addTo(map);

const pinIcon = L.divIcon({className:"",iconSize:[30,40],iconAnchor:[15,40],tooltipAnchor:[0,-36],
  html:`<div class="pp"><svg width="30" height="40" viewBox="0 0 30 40" aria-hidden="true">
    <path d="M15 1C7.3 1 1 7.2 1 14.9 1 25.2 15 39 15 39s14-13.8 14-24.1C29 7.2 22.7 1 15 1z" fill="#F2B33D" stroke="#fff" stroke-width="2"/>
    <circle cx="15" cy="15" r="5.2" fill="#16232E"/></svg></div>`});

PROPERTIES.forEach(p=>{
  L.marker([p.lat,p.lng],{icon:pinIcon,title:p.name,keyboard:true}).addTo(map)
   .bindTooltip(`<b>${p.name}</b><span>${p.address}</span>`,{className:"tip",direction:"top"})
   .on("click",()=>{location.hash="#/property/"+p.id});
});

/* ---------- property page ---------- */
const dash="—";
const fmt=n=>n==null?dash:Number(n).toLocaleString("en-US");
const val=v=>(v==null||v==="")?dash:v;
function monthsUntil(d){const t=new Date(d),n=new Date();return (t.getFullYear()-n.getFullYear())*12+(t.getMonth()-n.getMonth())}

function renderProperty(p){
  const ten=(p.tenants||[]).slice().sort((a,b)=>(a.exp||"9999").localeCompare(b.exp||"9999"));
  const rows = ten.length ? ten.map(t=>{
    const m=t.exp?monthsUntil(t.exp):null, soon=m!=null&&m>=0&&m<=24;
    const exp=t.exp?new Date(t.exp+"T00:00").toLocaleDateString("en-US",{month:"short",year:"numeric"}):dash;
    return `<tr><td>${t.name}</td><td>${val(t.suite)}</td><td class="num">${fmt(t.sf)}</td><td class="num ${soon?"soon":""}">${exp}</td></tr>`;
  }).join("") : `<tr><td class="empty" colspan="4">Tenant list to be added.</td></tr>`;
  const type = p.type ? (p.cls ? `${p.type}, Class ${p.cls}` : p.type) : dash;
  document.getElementById("propBody").innerHTML=`
    <div class="prop-hero">
      <div class="photo">${p.photo?`<img src="${p.photo}" alt="${p.name}">`:"Building photo"}</div>
      <div>
        <h2>${p.name}</h2>
        <p class="addr">${p.address}</p>
        <dl class="facts">
          <div><dt>Property type</dt><dd>${type}</dd></div>
          <div><dt>Rentable SF</dt><dd>${fmt(p.rsf)}</dd></div>
          <div><dt>Floors</dt><dd>${val(p.floors)}</dd></div>
          <div><dt>Year built</dt><dd>${val(p.yearBuilt)}</dd></div>
          <div><dt>Owner</dt><dd>${val(p.owner)}</dd></div>
          <div><dt>Occupancy</dt><dd>${val(p.occupancy)}</dd></div>
        </dl>
      </div>
    </div>
    <h3>Tenants${ten.length?`<small>${ten.length}</small>`:""}</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Tenant</th><th>Suite / building</th><th class="num">SF</th><th class="num">Lease expiration</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <p style="color:var(--muted);font-size:13px;margin-top:10px">Expirations within 24 months are highlighted.</p>`;
}

function route(){
  const m=location.hash.match(/^#\/property\/(.+)$/);
  const p=m&&PROPERTIES.find(x=>x.id===m[1]);
  document.getElementById("home").style.display=p?"none":"block";
  document.getElementById("prop").style.display=p?"block":"none";
  if(p){renderProperty(p);window.scrollTo(0,0)}else{map.invalidateSize()}
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
